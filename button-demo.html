<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TelePromt – Buton Stilleri Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: #0c0e12;
    color: #e2e2e8;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 60px;
    gap: 48px;
  }

  h1 { font-size: 28px; font-weight: 900; text-align: center; color: #fff; letter-spacing: -0.5px; }
  h1 span { color: #b8c3ff; }
  .subtitle { color: #6b7280; font-size: 14px; text-align: center; margin-top: 6px; }

  .section { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 12px; }
  .label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1.5px; color: #6b7280; padding-left: 4px;
  }

  /* ====== 1. GRADIENT + GLOW ====== */
  .btn-gradient {
    width: 100%; padding: 16px 24px; border: none; border-radius: 16px; cursor: pointer;
    font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, #6366f1 0%, #b8c3ff 50%, #06b6d4 100%);
    background-size: 200% 200%;
    box-shadow: 0 0 24px rgba(99,102,241,0.5), 0 4px 16px rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: all 0.3s ease;
    animation: gradientShift 3s ease infinite;
  }
  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .btn-gradient:hover { box-shadow: 0 0 40px rgba(99,102,241,0.7), 0 4px 20px rgba(0,0,0,0.5); transform: translateY(-1px); }
  .btn-gradient:active { transform: scale(0.97); }

  /* ====== 2. GLASSMORPHISM ====== */
  .glass-wrap {
    background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(6,182,212,0.15));
    border-radius: 20px; padding: 1px;
  }
  .btn-glass {
    width: 100%; padding: 16px 24px; border: none; border-radius: 19px; cursor: pointer;
    font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 700;
    color: rgba(255,255,255,0.9);
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: all 0.25s ease;
    position: relative; overflow: hidden;
  }
  .btn-glass::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 50%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.12), transparent);
    border-radius: 19px 19px 0 0;
    pointer-events: none;
  }
  .btn-glass:hover { background: rgba(255,255,255,0.12); color: #fff; }
  .btn-glass:active { transform: scale(0.97); }

  /* ====== 3. SHIMMER ====== */
  .btn-shimmer {
    width: 100%; padding: 16px 24px; border: none; border-radius: 16px; cursor: pointer;
    font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, #1e1f2e 0%, #2a2d4a 100%);
    border: 1px solid rgba(184,195,255,0.25);
    display: flex; align-items: center; justify-content: center; gap: 10px;
    position: relative; overflow: hidden;
    transition: all 0.25s ease;
    box-shadow: 0 2px 16px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .btn-shimmer::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
    transform: skewX(-20deg);
    animation: shimmer 2.5s ease-in-out infinite;
  }
  @keyframes shimmer {
    0% { left: -100%; }
    100% { left: 200%; }
  }
  .btn-shimmer:hover { border-color: rgba(184,195,255,0.5); box-shadow: 0 0 20px rgba(184,195,255,0.15); }
  .btn-shimmer:active { transform: scale(0.97); }

  /* ====== 4. 3D PRESSED ====== */
  .btn-3d {
    width: 100%; padding: 16px 24px; border: none; border-radius: 16px; cursor: pointer;
    font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 700; color: #0d1340;
    background: linear-gradient(to bottom, #c5d0ff 0%, #b8c3ff 50%, #9aabff 100%);
    box-shadow:
      0 6px 0 #5a6fd6,
      0 8px 16px rgba(90,111,214,0.4),
      inset 0 1px 0 rgba(255,255,255,0.5);
    display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: all 0.1s ease;
    transform: translateY(0);
  }
  .btn-3d:hover { background: linear-gradient(to bottom, #d0d8ff 0%, #c5d0ff 50%, #aabdff 100%); }
  .btn-3d:active {
    transform: translateY(4px);
    box-shadow:
      0 2px 0 #5a6fd6,
      0 3px 8px rgba(90,111,214,0.3),
      inset 0 1px 0 rgba(255,255,255,0.3);
  }

  /* ====== 5. ICON + METIN ====== */
  .btn-icon {
    width: 100%; padding: 14px 20px; border: none; border-radius: 16px; cursor: pointer;
    font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 700;
    color: #b8c3ff;
    background: rgba(184,195,255,0.08);
    border: 1px solid rgba(184,195,255,0.2);
    display: flex; align-items: center; gap: 14px;
    transition: all 0.25s ease;
    text-align: left;
  }
  .btn-icon:hover { background: rgba(184,195,255,0.14); border-color: rgba(184,195,255,0.4); color: #fff; }
  .btn-icon:hover .icon-wrap { background: rgba(184,195,255,0.2); transform: scale(1.1); }
  .btn-icon:active { transform: scale(0.98); }
  .icon-wrap {
    width: 44px; height: 44px; border-radius: 12px;
    background: rgba(184,195,255,0.12);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s ease;
  }
  .btn-icon .text-wrap { display: flex; flex-direction: column; gap: 2px; }
  .btn-icon .btn-title { font-size: 15px; font-weight: 700; }
  .btn-icon .btn-desc { font-size: 11px; font-weight: 400; color: rgba(255,255,255,0.4); }
  .btn-icon .arrow { margin-left: auto; opacity: 0.3; transition: all 0.2s; }
  .btn-icon:hover .arrow { opacity: 0.7; transform: translateX(3px); }

  .material-symbols-outlined { font-size: 22px; }

  /* Divider */
  .divider {
    width: 100%; max-width: 380px; height: 1px;
    background: linear-gradient(to right, transparent, rgba(255,255,255,0.08), transparent);
  }
</style>
</head>
<body>

<div>
  <h1>Tele<span>Promt</span></h1>
  <p class="subtitle">Buton Stilleri Karşılaştırması</p>
</div>

<!-- 1. Gradient + Glow -->
<div class="section">
  <div class="label">1 — Gradient + Glow Animasyonu</div>
  <button class="btn-gradient">
    <span class="material-symbols-outlined">videocam</span>
    Kayda Başla
  </button>
</div>

<div class="divider"></div>

<!-- 2. Glassmorphism -->
<div class="section">
  <div class="label">2 — Glassmorphism (Cam Efekti)</div>
  <div class="glass-wrap">
    <button class="btn-glass">
      <span class="material-symbols-outlined">save</span>
      Cihaza Kaydet
    </button>
  </div>
</div>

<div class="divider"></div>

<!-- 3. Shimmer -->
<div class="section">
  <div class="label">3 — Shimmer (Işık Kayması)</div>
  <button class="btn-shimmer">
    <span class="material-symbols-outlined">add_circle</span>
    Yeni Metin Ekle
  </button>
</div>

<div class="divider"></div>

<!-- 4. 3D Pressed -->
<div class="section">
  <div class="label">4 — 3D Pressed Effect</div>
  <button class="btn-3d">
    <span class="material-symbols-outlined">play_arrow</span>
    Başlat
  </button>
</div>

<div class="divider"></div>

<!-- 5. Icon + Metin -->
<div class="section">
  <div class="label">5 — Icon + Metin + Açıklama</div>
  <button class="btn-icon">
    <div class="icon-wrap">
      <span class="material-symbols-outlined" style="color:#b8c3ff">description</span>
    </div>
    <div class="text-wrap">
      <span class="btn-title">Metinlerim</span>
      <span class="btn-desc">3 metin kaydedildi</span>
    </div>
    <span class="material-symbols-outlined arrow">chevron_right</span>
  </button>
  <button class="btn-icon">
    <div class="icon-wrap" style="background:rgba(0,220,229,0.12)">
      <span class="material-symbols-outlined" style="color:#00dce5">video_library</span>
    </div>
    <div class="text-wrap">
      <span class="btn-title">Videolarım</span>
      <span class="btn-desc">Son kayıtlar burada</span>
    </div>
    <span class="material-symbols-outlined arrow">chevron_right</span>
  </button>
</div>

</body>
</html>
